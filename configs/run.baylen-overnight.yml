# run.baylen-overnight.yml — overnight training run for BaylenBunnies.
# Based on README guidance: 6 generations, 200 games/gen, minimax opponents.
# Expected wall time: ~12-18 hours on M1 Mac at ~70 games/hr.
deck: BaylenBunnies
version: 99
start_from_version: null

generations: 6
games_per_gen: 200
replay_buffer_gens: 3

opponents:
  - deck: Standard-MonoR
    mode: minimax
  - deck: Standard-MonoG
    mode: minimax
  - deck: Standard-MonoB
    mode: minimax
  - deck: Standard-MonoW
    mode: minimax
  - deck: Standard-MonoU
    mode: minimax

training:
  analyze_dataset: true
  generate_plots: true
  eval_previous_model: true

log_level: ACTIONS
curriculum: configs/curriculum.yml
